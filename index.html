<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TULIP Building — Luxury Residences</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#0a0a0a; --bg2:#111; --bg3:#1a1a1a; --bg4:#141414;
  --gold:#c9a84c; --gold2:#e8c96a; --gold-dim:#7a5f28;
  --text:#f0ece4; --text-dim:#9a9080; --border:#2a2520;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:72px;}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;letter-spacing:.18em;color:var(--gold);text-decoration:none;}
.logo span{font-style:italic;color:var(--text-dim);font-size:.72rem;display:block;letter-spacing:.3em;margin-top:-4px;}
.admin-btn{background:none;border:1px solid var(--gold-dim);color:var(--gold);padding:7px 18px;font-family:'Montserrat',sans-serif;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .3s;}
.admin-btn:hover{background:var(--gold);color:#000;}

/* HERO */
.hero{position:relative;height:360px;background:linear-gradient(135deg,#0a0a0a 0%,#1a1208 50%,#0a0a0a 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 60px,rgba(201,168,76,.02) 60px,rgba(201,168,76,.02) 61px);}
.hero-eye{font-size:.62rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;opacity:.8;}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.6rem,6vw,4.8rem);font-weight:300;line-height:1.1;letter-spacing:.04em;}
.hero h1 em{font-style:italic;color:var(--gold);}
.hero-sub{margin-top:14px;font-size:.72rem;letter-spacing:.25em;color:var(--text-dim);text-transform:uppercase;}
.gold-line{width:56px;height:1px;background:var(--gold);margin:22px auto 0;}

/* SEARCH */
.search-wrap{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:20px 40px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.search-wrap input,.search-wrap select{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Montserrat',sans-serif;font-size:.75rem;letter-spacing:.06em;padding:10px 14px;outline:none;transition:border-color .3s;flex:1;min-width:150px;}
.search-wrap input::placeholder{color:var(--text-dim);}
.search-wrap input:focus,.search-wrap select:focus{border-color:var(--gold-dim);}
.search-wrap select option{background:#1a1a1a;}
.search-btn{background:var(--gold);border:none;color:#000;padding:10px 26px;font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:background .3s;white-space:nowrap;}
.search-btn:hover{background:var(--gold2);}

/* GRID */
.main{padding:44px 40px;max-width:1400px;margin:0 auto;}
.section-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px;}
.section-title{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;letter-spacing:.05em;}
.count-badge{font-size:.62rem;letter-spacing:.2em;color:var(--text-dim);text-transform:uppercase;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:2px;}

/* CARD */
.card{background:var(--bg4);border:1px solid var(--border);cursor:pointer;overflow:hidden;transition:border-color .3s,transform .3s;animation:fadeUp .5s ease both;}
.card:hover{border-color:var(--gold-dim);transform:translateY(-3px);}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.card-img-wrap{position:relative;width:100%;height:220px;overflow:hidden;}
.card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
.card:hover .card-img{transform:scale(1.04);}
.card-img-ph{width:100%;height:220px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;}
.card-photo-count{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.7);color:var(--gold);font-size:.58rem;letter-spacing:.1em;padding:3px 8px;border:1px solid var(--gold-dim);}
.card-body{padding:20px 22px;}
.card-floor{font-size:.58rem;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;margin-bottom:7px;}
.card-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:400;margin-bottom:5px;}
.card-desc{font-size:.7rem;color:var(--text-dim);line-height:1.65;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:14px;}
.card-price{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--gold);font-weight:400;}
.card-price span{font-size:.62rem;font-family:'Montserrat',sans-serif;color:var(--text-dim);letter-spacing:.08em;}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--border);color:var(--text-dim);}
.tag.available{border-color:var(--gold-dim);color:var(--gold);}
.tag.rented{border-color:#2a2a2a;color:#444;}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;grid-column:1/-1;}
.empty-icon{font-size:2.8rem;margin-bottom:14px;opacity:.25;}
.empty h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:300;color:var(--text-dim);margin-bottom:7px;}
.empty p{font-size:.72rem;color:var(--text-dim);letter-spacing:.08em;}

/* DETAIL MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);max-width:700px;width:100%;max-height:92vh;overflow-y:auto;animation:mIn .3s ease;}
@keyframes mIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}

/* PHOTO GALLERY */
.gallery{position:relative;width:100%;height:300px;background:var(--bg3);overflow:hidden;}
.gallery-slides{display:flex;height:100%;transition:transform .4s ease;}
.gallery-slide{min-width:100%;height:100%;object-fit:cover;display:block;}
.gallery-slide-ph{min-width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:.62rem;letter-spacing:.2em;}
.gallery-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:1px solid var(--gold-dim);color:var(--gold);width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:2;}
.gallery-btn:hover{background:rgba(201,168,76,.2);}
.gallery-prev{left:10px;}
.gallery-next{right:10px;}
.gallery-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;}
.gdot{width:6px;height:6px;background:rgba(255,255,255,.3);border-radius:50%;cursor:pointer;transition:background .2s;}
.gdot.active{background:var(--gold);}

.modal-body{padding:28px 30px;}
.modal-floor{font-size:.58rem;letter-spacing:.4em;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
.modal-name{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;margin-bottom:4px;}
.modal-price{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--gold);margin-bottom:18px;}
.modal-price span{font-size:.68rem;font-family:'Montserrat',sans-serif;color:var(--text-dim);}
.divider{height:1px;background:var(--border);margin:18px 0;}
.modal-desc{font-size:.78rem;line-height:1.8;color:var(--text-dim);margin-bottom:18px;}
.modal-specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.spec{background:var(--bg3);padding:11px 14px;border:1px solid var(--border);}
.spec-label{font-size:.56rem;letter-spacing:.25em;text-transform:uppercase;color:var(--text-dim);margin-bottom:3px;}
.spec-val{font-family:'Cormorant Garamond',serif;font-size:1.05rem;}

/* CHAT BUTTONS */
.chat-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.chat-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:none;font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:opacity .2s;}
.chat-btn:hover{opacity:.88;}
.chat-line{background:#06C755;color:#fff;}
.chat-wa{background:#25D366;color:#fff;}
.modal-close-btn{background:none;border:1px solid var(--border);color:var(--text-dim);width:100%;padding:11px;font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:border-color .3s;}
.modal-close-btn:hover{border-color:var(--gold-dim);color:var(--text);}

/* FOOTER */
footer{border-top:1px solid var(--border);background:var(--bg2);padding:44px 40px 28px;}
.footer-inner{max-width:1400px;margin:0 auto;}
.footer-brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;color:var(--gold);letter-spacing:.15em;margin-bottom:6px;}
.footer-tagline{font-size:.62rem;letter-spacing:.25em;color:var(--text-dim);text-transform:uppercase;margin-bottom:28px;}
.footer-contacts{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:28px;}
.footer-contact-item{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text-dim);font-size:.72rem;letter-spacing:.06em;transition:color .25s;padding:10px 16px;border:1px solid var(--border);}
.footer-contact-item:hover{color:var(--gold);border-color:var(--gold-dim);}
.footer-contact-item .fc-icon{font-size:1.1rem;}
.footer-contact-item .fc-label{font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:2px;}
.footer-contact-item .fc-val{font-size:.75rem;color:var(--text);}
.footer-bottom{border-top:1px solid var(--border);padding-top:18px;font-size:.6rem;letter-spacing:.15em;color:var(--text-dim);text-transform:uppercase;text-align:center;}

/* ADMIN */
#adminOverlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
#adminOverlay.show{display:flex;}
.admin-modal{background:var(--bg2);border:1px solid var(--gold-dim);width:100%;max-width:760px;margin:auto;animation:mIn .3s ease;}
.admin-hdr{padding:20px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.admin-hdr h2{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;color:var(--gold);}
.close-x{background:none;border:none;color:var(--text-dim);font-size:1.3rem;cursor:pointer;padding:4px 8px;}
.close-x:hover{color:var(--text);}
.admin-body{padding:28px;}

.tab-bar{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;gap:2px;}
.tab-btn{padding:9px 18px;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;border:none;border-bottom:2px solid transparent;color:var(--text-dim);background:none;font-family:'Montserrat',sans-serif;transition:all .2s;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}

/* FORMS */
.fg{margin-bottom:16px;}
.fg label{display:block;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px;}
.fg input,.fg textarea,.fg select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Montserrat',sans-serif;font-size:.78rem;padding:10px 13px;outline:none;transition:border-color .3s;}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--gold-dim);}
.fg textarea{height:80px;resize:vertical;}
.fg select option{background:#1a1a1a;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.btn-gold{background:var(--gold);border:none;color:#000;padding:11px 24px;font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:background .3s;width:100%;}
.btn-gold:hover{background:var(--gold2);}
.btn-out{background:none;border:1px solid var(--border);color:var(--text-dim);padding:9px 20px;font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .25s;width:100%;margin-top:8px;}
.btn-out:hover{border-color:var(--gold-dim);color:var(--text);}
.err{color:#c0392b;font-size:.7rem;margin-top:7px;text-align:center;}
.suc{color:#27ae60;font-size:.7rem;margin-top:7px;text-align:center;}

/* PHOTO UPLOAD AREA */
.photo-upload-area{border:2px dashed var(--border);padding:22px;text-align:center;cursor:pointer;transition:border-color .3s;margin-bottom:12px;position:relative;}
.photo-upload-area:hover,.photo-upload-area.drag{border-color:var(--gold-dim);}
.photo-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.photo-upload-area p{font-size:.72rem;color:var(--text-dim);letter-spacing:.08em;}
.photo-upload-area .pu-icon{font-size:2rem;margin-bottom:8px;opacity:.4;}
.photo-upload-area .pu-limit{font-size:.58rem;color:var(--gold-dim);margin-top:6px;letter-spacing:.1em;}
.photo-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.photo-thumb-wrap{position:relative;width:80px;height:60px;}
.photo-thumb{width:80px;height:60px;object-fit:cover;border:1px solid var(--border);}
.photo-thumb-del{position:absolute;top:-6px;right:-6px;background:#c0392b;border:none;color:#fff;width:18px;height:18px;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.photo-count-info{font-size:.62rem;color:var(--text-dim);letter-spacing:.08em;margin-bottom:14px;}

/* ADMIN ROOM LIST */
.admin-room-item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);}
.admin-room-thumb{width:64px;height:48px;object-fit:cover;background:var(--bg3);flex-shrink:0;}
.admin-room-info{flex:1;}
.admin-room-name{font-size:.82rem;color:var(--text);margin-bottom:2px;}
.admin-room-meta{font-size:.62rem;color:var(--text-dim);letter-spacing:.08em;}
.admin-room-acts{display:flex;gap:7px;}
.btn-edit,.btn-del{background:none;font-family:'Montserrat',sans-serif;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;cursor:pointer;transition:all .2s;border:1px solid var(--border);}
.btn-edit{color:var(--gold);border-color:var(--gold-dim);}
.btn-edit:hover{background:var(--gold);color:#000;}
.btn-del{color:#777;}
.btn-del:hover{border-color:#c0392b;color:#c0392b;}

/* CONTACT EDIT */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){
  header{padding:0 18px;}
  .search-wrap{padding:14px 18px;}
  .main{padding:28px 18px;}
  .frow,.contact-grid{grid-template-columns:1fr;}
  .admin-body{padding:18px;}
  .chat-btns{grid-template-columns:1fr;}
  .modal-body{padding:20px;}
  footer{padding:32px 20px 20px;}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">TULIP<span>Building Residences</span></a>
  <button class="admin-btn" onclick="openAdmin()">Admin</button>
</header>

<section class="hero">
  <p class="hero-eye">Bangkok · Premium Living</p>
  <h1>Find Your <em>Perfect</em><br>Residence</h1>
  <p class="hero-sub">TULIP Building · Available Rooms</p>
  <div class="gold-line"></div>
</section>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Search room name, floor…" oninput="renderListings()"/>
  <select id="filterStatus" onchange="renderListings()">
    <option value="">All Status</option>
    <option value="available">Available</option>
    <option value="rented">Rented</option>
  </select>
  <select id="filterType" onchange="renderListings()">
    <option value="">All Types</option>
    <option value="studio">Studio</option>
    <option value="1br">1 Bedroom</option>
    <option value="2br">2 Bedrooms</option>
    <option value="penthouse">Penthouse</option>
  </select>
  <button class="search-btn" onclick="renderListings()">Search</button>
</div>

<main class="main">
  <div class="section-hdr">
    <h2 class="section-title">Our Rooms</h2>
    <span class="count-badge" id="countBadge"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<!-- FOOTER -->
<footer>
  <div class="footer-inner">
    <div class="footer-brand">TULIP Building</div>
    <div class="footer-tagline">Bangkok Luxury Residences</div>
    <div class="footer-contacts" id="footerContacts"></div>
    <div class="footer-bottom">© TULIP Building · All rights reserved</div>
  </div>
</footer>

<!-- DETAIL OVERLAY -->
<div class="overlay" id="detailOverlay" onclick="closeDetailOuter(event)">
  <div class="modal" id="detailModal"></div>
</div>

<!-- ADMIN OVERLAY -->
<div id="adminOverlay" onclick="closeAdminOuter(event)">
  <div class="admin-modal" id="adminModal">
    <div class="admin-hdr">
      <h2 id="adminTitle">Admin Access</h2>
      <button class="close-x" onclick="closeAdmin()">✕</button>
    </div>
    <div class="admin-body" id="adminBody"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════
const ROOMS_KEY    = 'tulip_rooms';
const CONTACT_KEY  = 'tulip_contacts';
const PASS_KEY     = 'tulip_pass';
const MAX_ROOMS    = 10;
const MAX_PHOTOS   = 15;
const DEFAULT_PASS = 'tulip2024';

function getRooms()    { try{return JSON.parse(localStorage.getItem(ROOMS_KEY))||[];}catch{return[];} }
function saveRooms(d)  { localStorage.setItem(ROOMS_KEY, JSON.stringify(d)); }
function getContacts() {
  try{return JSON.parse(localStorage.getItem(CONTACT_KEY))||{};}
  catch{return {};}
}
function saveContacts(d){ localStorage.setItem(CONTACT_KEY, JSON.stringify(d)); }
function getPass()     { return localStorage.getItem(PASS_KEY)||DEFAULT_PASS; }
function savePass(p)   { localStorage.setItem(PASS_KEY, p); }
function genId()       { return 'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,5); }

// ══════════════════════════════════════════
//  FOOTER
// ══════════════════════════════════════════
function renderFooter() {
  const c = getContacts();
  const items = [];
  if(c.phone) items.push(`<a class="footer-contact-item" href="tel:${c.phone}"><span class="fc-icon">📞</span><span><span class="fc-label">Phone</span><span class="fc-val">${c.phone}</span></span></a>`);
  if(c.line)  items.push(`<a class="footer-contact-item" href="https://line.me/ti/p/~${c.line}" target="_blank"><span class="fc-icon">💚</span><span><span class="fc-label">LINE</span><span class="fc-val">${c.line}</span></span></a>`);
  if(c.whatsapp) items.push(`<a class="footer-contact-item" href="https://wa.me/${c.whatsapp.replace(/\D/g,'')}" target="_blank"><span class="fc-icon">💬</span><span><span class="fc-label">WhatsApp</span><span class="fc-val">${c.whatsapp}</span></span></a>`);
  if(c.facebook) items.push(`<a class="footer-contact-item" href="${c.facebook.startsWith('http')?c.facebook:'https://facebook.com/'+c.facebook}" target="_blank"><span class="fc-icon">📘</span><span><span class="fc-label">Facebook</span><span class="fc-val">${c.facebook}</span></span></a>`);
  if(c.email) items.push(`<a class="footer-contact-item" href="mailto:${c.email}"><span class="fc-icon">✉️</span><span><span class="fc-label">Email</span><span class="fc-val">${c.email}</span></span></a>`);
  const el = document.getElementById('footerContacts');
  if(items.length) el.innerHTML = items.join('');
  else el.innerHTML = `<p style="font-size:.72rem;color:var(--text-dim);letter-spacing:.1em">Contact details not yet configured. Log in as admin to add.</p>`;
}

// ══════════════════════════════════════════
//  PUBLIC LISTINGS
// ══════════════════════════════════════════
function renderListings() {
  const q      = (document.getElementById('searchInput').value||'').toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const type   = document.getElementById('filterType').value;
  let list     = getRooms();
  if(q)      list = list.filter(r=>(r.name+r.floor+r.desc).toLowerCase().includes(q));
  if(status) list = list.filter(r=>r.status===status);
  if(type)   list = list.filter(r=>r.type===type);

  document.getElementById('countBadge').textContent = list.length+' listing'+(list.length!==1?'s':'');
  const grid = document.getElementById('grid');

  if(!list.length){
    grid.innerHTML=`<div class="empty"><div class="empty-icon">🏢</div><h3>No rooms found</h3><p>Try adjusting your search filters</p></div>`;
    return;
  }
  grid.innerHTML = list.map((r,i)=>{
    const photos = r.photos||[];
    const firstPhoto = photos[0]||'';
    return `<div class="card" style="animation-delay:${i*.05}s" onclick="openDetail('${r.id}')">
      <div class="card-img-wrap">
        ${firstPhoto
          ? `<img class="card-img" src="${firstPhoto}" alt="${r.name}" loading="lazy"/>`
          : `<div class="card-img-ph">No Photo</div>`}
        ${photos.length>1?`<div class="card-photo-count">📷 ${photos.length}</div>`:''}
      </div>
      <div class="card-body">
        <div class="card-floor">${r.floor?'Floor '+r.floor:'TULIP Building'}</div>
        <div class="card-name">${r.name}</div>
        <div class="card-desc">${r.desc||'A distinguished residence at TULIP Building.'}</div>
        <div class="card-footer">
          <div class="card-price">฿${Number(r.price).toLocaleString()} <span>/ month</span></div>
          <div class="card-tags">
            ${r.type?`<span class="tag">${r.type==='1br'?'1 Bed':r.type==='2br'?'2 Bed':r.type.charAt(0).toUpperCase()+r.type.slice(1)}</span>`:''}
            <span class="tag ${r.status==='available'?'available':'rented'}">${r.status==='available'?'Available':'Rented'}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════
//  DETAIL MODAL + GALLERY
// ══════════════════════════════════════════
let currentGallery = [], galleryIdx = 0;

function openDetail(id) {
  const r = getRooms().find(x=>x.id===id);
  if(!r) return;
  const c = getContacts();
  const photos = r.photos||[];
  currentGallery = photos;
  galleryIdx = 0;

  const galleryHTML = photos.length
    ? `<div class="gallery" id="gallery">
        <div class="gallery-slides" id="gallerySlides">
          ${photos.map(p=>`<img class="gallery-slide" src="${p}" alt="${r.name}"/>`).join('')}
        </div>
        ${photos.length>1?`
          <button class="gallery-btn gallery-prev" onclick="galPrev(event)">‹</button>
          <button class="gallery-btn gallery-next" onclick="galNext(event)">›</button>
          <div class="gallery-dots" id="galDots">
            ${photos.map((_,i)=>`<div class="gdot${i===0?' active':''}" onclick="galTo(event,${i})"></div>`).join('')}
          </div>`:''}
      </div>`
    : `<div class="gallery"><div class="gallery-slide-ph">No Photos Available</div></div>`;

  const lineBtn  = c.line     ? `<a class="chat-btn chat-line" href="https://line.me/ti/p/~${c.line}" target="_blank">💚 Chat on LINE</a>` : '';
  const waBtn    = c.whatsapp ? `<a class="chat-btn chat-wa" href="https://wa.me/${c.whatsapp.replace(/\D/g,'')}?text=Hi!%20I'm%20interested%20in%20${encodeURIComponent(r.name)}%20at%20TULIP%20Building." target="_blank">💬 WhatsApp Us</a>` : '';
  const chatSection = (lineBtn||waBtn)
    ? `<div class="chat-btns">${lineBtn}${waBtn}</div>`
    : `<div style="font-size:.72rem;color:var(--text-dim);margin-bottom:12px;text-align:center;letter-spacing:.08em">Contact details not yet configured.</div>`;

  document.getElementById('detailModal').innerHTML = `
    ${galleryHTML}
    <div class="modal-body">
      <div class="modal-floor">${r.floor?'Floor '+r.floor+' · ':''}TULIP Building</div>
      <div class="modal-name">${r.name}</div>
      <div class="modal-price">฿${Number(r.price).toLocaleString()} <span>/ month</span></div>
      <div class="divider"></div>
      <div class="modal-desc">${r.desc||'A distinguished residence at TULIP Building, Bangkok.'}</div>
      <div class="modal-specs">
        <div class="spec"><div class="spec-label">Type</div><div class="spec-val">${r.type||'—'}</div></div>
        <div class="spec"><div class="spec-label">Floor</div><div class="spec-val">${r.floor||'—'}</div></div>
        <div class="spec"><div class="spec-label">Size</div><div class="spec-val">${r.size?r.size+' sqm':'—'}</div></div>
        <div class="spec"><div class="spec-label">Status</div><div class="spec-val">${r.status==='available'?'✓ Available':'Rented'}</div></div>
      </div>
      ${chatSection}
      <button class="modal-close-btn" onclick="closeDetail()">Close</button>
    </div>`;
  document.getElementById('detailOverlay').classList.add('show');
}

function galPrev(e){e.stopPropagation();galTo(null,galleryIdx>0?galleryIdx-1:currentGallery.length-1);}
function galNext(e){e.stopPropagation();galTo(null,galleryIdx<currentGallery.length-1?galleryIdx+1:0);}
function galTo(e,i){
  if(e) e.stopPropagation();
  galleryIdx=i;
  const sl=document.getElementById('gallerySlides');
  if(sl) sl.style.transform=`translateX(-${i*100}%)`;
  document.querySelectorAll('.gdot').forEach((d,j)=>d.classList.toggle('active',j===i));
}
function closeDetail(){document.getElementById('detailOverlay').classList.remove('show');}
function closeDetailOuter(e){if(e.target===document.getElementById('detailOverlay'))closeDetail();}

// ══════════════════════════════════════════
//  ADMIN
// ══════════════════════════════════════════
let adminIn = false;

function openAdmin(){
  document.getElementById('adminOverlay').classList.add('show');
  if(adminIn){showDashboard();return;}
  document.getElementById('adminTitle').textContent='Admin Access';
  document.getElementById('adminBody').innerHTML=`
    <p style="font-size:.75rem;color:var(--text-dim);margin-bottom:20px;letter-spacing:.08em">Enter your administrator password.</p>
    <div class="fg"><label>Password</label>
      <input type="password" id="passIn" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-gold" onclick="doLogin()">Enter</button>
    <div id="loginErr" class="err"></div>`;
  setTimeout(()=>document.getElementById('passIn')?.focus(),100);
}
function doLogin(){
  if(document.getElementById('passIn').value===getPass()){
    adminIn=true; showDashboard();
  } else {
    document.getElementById('loginErr').textContent='Incorrect password.';
  }
}
function closeAdmin(){document.getElementById('adminOverlay').classList.remove('show');}
function closeAdminOuter(e){if(e.target===document.getElementById('adminOverlay'))closeAdmin();}

function showDashboard(tab='rooms'){
  document.getElementById('adminTitle').textContent='Admin Panel';
  document.getElementById('adminBody').innerHTML=`
    <div class="tab-bar">
      <button class="tab-btn ${tab==='rooms'?'active':''}" onclick="showDashboard('rooms')">Rooms</button>
      <button class="tab-btn ${tab==='add'?'active':''}" onclick="showDashboard('add')">+ Add Room</button>
      <button class="tab-btn ${tab==='contacts'?'active':''}" onclick="showDashboard('contacts')">Contacts</button>
      <button class="tab-btn ${tab==='settings'?'active':''}" onclick="showDashboard('settings')">Settings</button>
    </div>
    <div id="tabContent"></div>`;
  if(tab==='rooms')    renderAdminRooms();
  else if(tab==='add') renderRoomForm();
  else if(tab==='contacts') renderContactsForm();
  else if(tab==='settings') renderSettings();
}

// ── ROOMS LIST ──
function renderAdminRooms(){
  const rooms = getRooms();
  const el = document.getElementById('tabContent');
  const remaining = MAX_ROOMS - rooms.length;
  let html = `<div style="font-size:.62rem;color:var(--text-dim);margin-bottom:14px;letter-spacing:.08em">${rooms.length}/${MAX_ROOMS} rooms used</div>`;
  if(!rooms.length){
    html+=`<p style="color:var(--text-dim);font-size:.78rem;text-align:center;padding:28px 0">No rooms yet. Use "Add Room" tab to get started.</p>`;
  } else {
    html += rooms.map(r=>{
      const thumb = (r.photos||[])[0]||'';
      return `<div class="admin-room-item">
        ${thumb?`<img class="admin-room-thumb" src="${thumb}" alt=""/>`:
          `<div class="admin-room-thumb" style="display:flex;align-items:center;justify-content:center;font-size:.52rem;color:var(--text-dim)">NO PHOTO</div>`}
        <div class="admin-room-info">
          <div class="admin-room-name">${r.name}</div>
          <div class="admin-room-meta">Floor ${r.floor||'—'} · ฿${Number(r.price).toLocaleString()} · ${r.status} · ${(r.photos||[]).length} photo(s)</div>
        </div>
        <div class="admin-room-acts">
          <button class="btn-edit" onclick="editRoom('${r.id}')">Edit</button>
          <button class="btn-del" onclick="deleteRoom('${r.id}')">Del</button>
        </div>
      </div>`;
    }).join('');
  }
  el.innerHTML = html;
}

// ── ROOM FORM ──
let formPhotos = []; // base64 array for current form

function renderRoomForm(existing){
  const r = existing||{};
  formPhotos = (r.photos||[]).slice();
  const rooms = getRooms();
  const atMax = !existing && rooms.length >= MAX_ROOMS;

  if(atMax){
    document.getElementById('tabContent').innerHTML=`<p style="color:#c0392b;font-size:.78rem;text-align:center;padding:32px 0">Maximum of ${MAX_ROOMS} rooms reached. Delete a room before adding a new one.</p>`;
    return;
  }

  document.getElementById('tabContent').innerHTML=`
    <div class="frow">
      <div class="fg"><label>Room Name *</label><input type="text" id="f_name" value="${r.name||''}" placeholder="e.g. Suite 801"/></div>
      <div class="fg"><label>Floor</label><input type="text" id="f_floor" value="${r.floor||''}" placeholder="e.g. 8"/></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Monthly Rent (฿) *</label><input type="number" id="f_price" value="${r.price||''}" placeholder="e.g. 15000"/></div>
      <div class="fg"><label>Size (sqm)</label><input type="number" id="f_size" value="${r.size||''}" placeholder="e.g. 35"/></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Room Type</label>
        <select id="f_type">
          <option value="">— Select —</option>
          ${['studio','1br','2br','penthouse'].map(t=>`<option value="${t}" ${r.type===t?'selected':''}>${t==='1br'?'1 Bedroom':t==='2br'?'2 Bedrooms':t.charAt(0).toUpperCase()+t.slice(1)}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label>Status</label>
        <select id="f_status">
          <option value="available" ${r.status!=='rented'?'selected':''}>Available</option>
          <option value="rented" ${r.status==='rented'?'selected':''}>Rented</option>
        </select>
      </div>
    </div>
    <div class="fg"><label>Description</label><textarea id="f_desc" placeholder="Describe the room, features, amenities…">${r.desc||''}</textarea></div>
    <div class="fg">
      <label>Photos (max ${MAX_PHOTOS})</label>
      <div id="photoThumbsWrap" class="photo-thumbs"></div>
      <div class="photo-count-info" id="photoCountInfo"></div>
      <div class="photo-upload-area" id="uploadArea">
        <input type="file" id="photoFileInput" accept="image/*" multiple onchange="handlePhotoUpload(event)"/>
        <div class="pu-icon">📷</div>
        <p>Click or drag & drop photos here</p>
        <p class="pu-limit">JPG, PNG, WEBP · Max ${MAX_PHOTOS} photos per room</p>
      </div>
    </div>
    <button class="btn-gold" onclick="saveRoom('${r.id||''}')">${r.id?'Update Room':'Add Room'}</button>
    ${r.id?`<button class="btn-out" onclick="showDashboard('rooms')">Cancel</button>`:''}
    <div id="formMsg"></div>`;

  renderPhotoThumbs();
}

function renderPhotoThumbs(){
  const wrap = document.getElementById('photoThumbsWrap');
  const info = document.getElementById('photoCountInfo');
  if(!wrap) return;
  wrap.innerHTML = formPhotos.map((p,i)=>`
    <div class="photo-thumb-wrap">
      <img class="photo-thumb" src="${p}" alt="photo ${i+1}"/>
      <button class="photo-thumb-del" onclick="removePhoto(${i})">×</button>
    </div>`).join('');
  if(info) info.textContent = `${formPhotos.length}/${MAX_PHOTOS} photos`;
  const ua = document.getElementById('uploadArea');
  if(ua) ua.style.opacity = formPhotos.length>=MAX_PHOTOS?'.4':'1';
  const fi = document.getElementById('photoFileInput');
  if(fi) fi.disabled = formPhotos.length>=MAX_PHOTOS;
}

function removePhoto(i){
  formPhotos.splice(i,1);
  renderPhotoThumbs();
}

function handlePhotoUpload(e){
  const files = Array.from(e.target.files);
  const remaining = MAX_PHOTOS - formPhotos.length;
  const toLoad = files.slice(0, remaining);
  if(files.length > remaining) alert(`Only ${remaining} more photo(s) can be added. Extra files ignored.`);
  let loaded = 0;
  toLoad.forEach(file=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      formPhotos.push(ev.target.result);
      loaded++;
      if(loaded===toLoad.length) renderPhotoThumbs();
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function saveRoom(existingId){
  const name  = document.getElementById('f_name').value.trim();
  const price = document.getElementById('f_price').value.trim();
  if(!name||!price){
    document.getElementById('formMsg').innerHTML=`<div class="err">Room name and price are required.</div>`;
    return;
  }
  const room = {
    id: existingId||genId(), name, price,
    floor:  document.getElementById('f_floor').value.trim(),
    size:   document.getElementById('f_size').value.trim(),
    type:   document.getElementById('f_type').value,
    status: document.getElementById('f_status').value,
    desc:   document.getElementById('f_desc').value.trim(),
    photos: formPhotos.slice(),
  };
  let list = getRooms();
  if(existingId) list = list.map(r=>r.id===existingId?room:r);
  else list.push(room);
  saveRooms(list);
  renderListings();
  document.getElementById('formMsg').innerHTML=`<div class="suc">${existingId?'Room updated!':'Room added!'}</div>`;
  setTimeout(()=>showDashboard('rooms'),900);
}

function editRoom(id){
  const r = getRooms().find(x=>x.id===id);
  if(!r) return;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===1));
  renderRoomForm(r);
}

function deleteRoom(id){
  if(!confirm('Delete this room? This cannot be undone.')) return;
  saveRooms(getRooms().filter(r=>r.id!==id));
  renderListings();
  renderAdminRooms();
}

// ── CONTACTS FORM ──
function renderContactsForm(){
  const c = getContacts();
  document.getElementById('tabContent').innerHTML=`
    <p style="font-size:.72rem;color:var(--text-dim);margin-bottom:18px;letter-spacing:.06em;line-height:1.7">These appear in the footer and are used for the quick-chat buttons on each room listing.</p>
    <div class="contact-grid">
      <div class="fg"><label>📞 Phone Number</label><input type="text" id="c_phone" value="${c.phone||''}" placeholder="+66 8x xxx xxxx"/></div>
      <div class="fg"><label>💚 LINE ID</label><input type="text" id="c_line" value="${c.line||''}" placeholder="your_line_id"/></div>
      <div class="fg"><label>💬 WhatsApp Number</label><input type="text" id="c_wa" value="${c.whatsapp||''}" placeholder="+66 8x xxx xxxx"/></div>
      <div class="fg"><label>📘 Facebook Page</label><input type="text" id="c_fb" value="${c.facebook||''}" placeholder="facebook.com/yourpage or page name"/></div>
    </div>
    <div class="fg"><label>✉️ Email Address</label><input type="email" id="c_email" value="${c.email||''}" placeholder="your@email.com"/></div>
    <button class="btn-gold" onclick="saveContacts2()">Save Contacts</button>
    <div id="contactMsg"></div>`;
}

function saveContacts2(){
  const c = {
    phone:    document.getElementById('c_phone').value.trim(),
    line:     document.getElementById('c_line').value.trim(),
    whatsapp: document.getElementById('c_wa').value.trim(),
    facebook: document.getElementById('c_fb').value.trim(),
    email:    document.getElementById('c_email').value.trim(),
  };
  saveContacts(c);
  renderFooter();
  document.getElementById('contactMsg').innerHTML=`<div class="suc">Contacts saved! Footer and chat buttons updated.</div>`;
}

// ── SETTINGS ──
function renderSettings(){
  document.getElementById('tabContent').innerHTML=`
    <p style="font-size:.72rem;color:var(--text-dim);margin-bottom:18px;letter-spacing:.06em">Change your admin password. Make sure to remember it — there is no recovery option.</p>
    <div class="fg"><label>Current Password</label><input type="password" id="s_old" placeholder="••••••••"/></div>
    <div class="fg"><label>New Password</label><input type="password" id="s_new" placeholder="••••••••"/></div>
    <div class="fg"><label>Confirm New Password</label><input type="password" id="s_new2" placeholder="••••••••"/></div>
    <button class="btn-gold" onclick="changePass()">Update Password</button>
    <div id="passMsg"></div>`;
}

function changePass(){
  const old  = document.getElementById('s_old').value;
  const nw   = document.getElementById('s_new').value;
  const nw2  = document.getElementById('s_new2').value;
  const msg  = document.getElementById('passMsg');
  if(old!==getPass()){ msg.innerHTML=`<div class="err">Current password is incorrect.</div>`; return; }
  if(nw.length<6)    { msg.innerHTML=`<div class="err">New password must be at least 6 characters.</div>`; return; }
  if(nw!==nw2)       { msg.innerHTML=`<div class="err">New passwords do not match.</div>`; return; }
  savePass(nw);
  msg.innerHTML=`<div class="suc">Password updated successfully.</div>`;
}

// ── INIT ──
renderListings();
renderFooter();
</script>
</body>
</html>
